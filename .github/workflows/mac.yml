# Builds ComfyLauncher-mac.zip on a Mac, from the ComfyLauncher.exe of a
# release. See mac/Build-MacApp.sh.
#
# Run by hand with a tag: the zip is a build artifact only, for a test.
# NOT RUN ON A RELEASE: the app opens the launcher, but the game does not
# start in its plain Wine (VanillaFixes cannot load the DLLs, and the client
# crashes on an instruction Rosetta cannot run). Mac players use WoWSilicon,
# with ComfyLauncher.exe in its launcher slot. Add `release: types:
# [published]` back when the app starts the game.
name: Mac app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build from, for example v1.42
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the release's exe
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern ComfyLauncher.zip --dir release
          unzip -o release/ComfyLauncher.zip ComfyLauncher.exe -d release

      - name: Build the app
        run: bash mac/Build-MacApp.sh release/ComfyLauncher.exe "${TAG#v}" out

      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" out/ComfyLauncher-mac.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ComfyLauncher-mac-${{ inputs.tag }}
          path: out/ComfyLauncher-mac.zip
